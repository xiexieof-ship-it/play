<!DOCTYPE html>
<html>
<head>
  <base href="/play/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play - 黑底白球小游戏：拍子接球">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Play</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // 离线可用：注册自带缓存的 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('flutter_service_worker.js', { scope: './' })
          .catch(function (e) { console.warn('service worker failed', e); });
      });
    }
  </script>
</head>
<body style="margin:0;background:#000;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
